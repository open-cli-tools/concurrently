name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  meta:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.detect.outputs.latest }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: detect
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
  gh-release:
    name: Create GitHub Release
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --latest=${{ needs.meta.outputs.latest }}

  publish-npm:
    name: Publish to NPM
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-registry: https://registry.npmjs.org
          node-version: 24

      - name: Publish to NPM
        env:
          NPM_CONFIG_PROVENANCE: true
        run: pnpm publish --no-git-checks --tag=${{ case(needs.meta.outputs.latest == 'true', 'latest', 'backport') }}
